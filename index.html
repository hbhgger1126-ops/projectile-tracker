<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포물선 운동 분석</title>
<style>
  :root { --bg: #f6f7f9; --text: #1b1f24; --muted: #5f6b7a; --accent: #1f6feb; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --text: #e6e9ee; --muted: #9aa5b4; --accent: #4a8cff; --accent-text: #0b0d10; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  a.btn { display: inline-block; margin-top: 12px; padding: 14px 20px; border-radius: 10px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>포물선 운동 영상 분석</h1>
  <p>현재 개발 중입니다.</p>
  <a class="btn" href="phase0/">0단계: 프레임 이동 검증</a>
</main>
</body>
</html>
